<div class="modal-backdrop" role="presentation" (click)="$event.target === $event.currentTarget && closed.emit()"><section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="evidence-title" (click)="$event.stopPropagation()"><header class="modal-card__header"><div><p class="eyebrow">Justificatif</p><h2 id="evidence-title">Déposer une preuve</h2><p>{{ task().title }}</p></div><button class="icon-button" type="button" (click)="closed.emit()" aria-label="Fermer">×</button></header>
  <div class="upload-zone"><span aria-hidden="true">⇧</span><label for="evidence-file">PDF ou image, 10 Mo maximum</label><input id="evidence-file" type="file" accept="application/pdf,image/*" (change)="choose($event)">@if (selectedFile()) { <strong>{{ selectedFile()!.name }}</strong> }</div>
  <div class="field"><label for="evidence-description">Description</label><textarea id="evidence-description" rows="3" [(ngModel)]="description" placeholder="Précisez ce que démontre ce document."></textarea></div>
  @if (error()) { <p class="inline-error" role="alert">{{ error() }}</p> }
  <footer class="modal-card__actions"><button class="button button--ghost" type="button" (click)="closed.emit()">Annuler</button><button class="button button--primary" type="button" [disabled]="service.saving()" (click)="submit()">{{ service.saving() ? 'Envoi…' : 'Déposer la preuve' }}</button></footer>
</section></div>
